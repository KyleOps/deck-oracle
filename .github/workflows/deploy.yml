name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch; a newer push to a pull request cancels the older run.
# Pushes to main are never cancelled mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The unit suite with a coverage floor on the pure modules (js/utils,
      # js/data); fails on a failing test or when coverage drops.
      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Functional tests, then the performance budgets (run alone).
      - name: Browser tests and performance budgets
        run: npm run test:e2e

      # Screenshot comparisons start once Linux baselines are committed (run
      # the "Update visual baselines" workflow); until then this is skipped.
      - name: Visual comparisons
        if: hashFiles('tests/visual/__screenshots__/linux/**') != ''
        run: npm run test:visual

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-report-visual/
          if-no-files-found: ignore
          retention-days: 7

  # Build and deploy are separate jobs on purpose. In one job, deploy-pages
  # queried the artifact 0.4 s after upload and GitHub's API didn't list it
  # yet ("No artifacts named github-pages were found"); a re-run then failed
  # with two same-named artifacts. A job boundary gives the upload time to
  # register, and a re-run of `deploy` alone reuses the one artifact.
  build:
    name: Build site
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Ship the site, not the repository: no tests, docs, design handoff
      # files or archives in the public artifact.
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js css js images _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
