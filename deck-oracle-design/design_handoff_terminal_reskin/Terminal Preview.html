<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Deck Oracle — TERMINAL reskin (design reference)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; background: #080a09; }
  body { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .wrap { display: flex; gap: 24px; padding: 24px; align-items: flex-start; min-width: max-content; }
  .label { color: #5a6b66; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 10px; padding-left: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="label">◆ TERMINAL · desktop · 1440 wide</div>
      <div id="root-desktop"></div>
    </div>
    <div>
      <div class="label">◆ TERMINAL · mobile · 412 wide</div>
      <div id="root-mobile"></div>
    </div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="canvas/portent-math.js"></script>
  <script type="text/babel" src="canvas/terminal.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root-desktop')).render(<TerminalView />);
    ReactDOM.createRoot(document.getElementById('root-mobile')).render(<TerminalMobile />);
  </script>
</body>
</html>
